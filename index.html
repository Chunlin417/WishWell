<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WishWell</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070f;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    /* 长按不选中、不弹"拷贝 / 翻译"菜单，点击不出现灰色高亮 */
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  input { -webkit-user-select: text; user-select: text; }   /* 搜索框仍然可以正常输入、选中文字 */
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  /* 没有文字的深色遮罩：场景第一帧画好后淡出，避免加载时闪一下 */
  #loading { position: fixed; inset: 0; background: #05070f; transition: opacity 1.6s; z-index: 10; }
  #loading.done { opacity: 0; pointer-events: none; }
  /* 切换场景时的白幕：先淡成一片白，换好场景再淡回来 */
  #fade { position: fixed; inset: 0; background: #f6f1e4; opacity: 0; pointer-events: none; transition: opacity 1.3s ease-in-out; z-index: 8; }
  #fade.on { opacity: 1; pointer-events: auto; transition-duration: .9s; }
  /* 小院里的操作提示：进院时出现，走动之后淡掉 */
  #hint { position: fixed; left: 50%; bottom: calc(7vh + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 4;
    padding: 7px 16px; border-radius: 999px; background: rgba(20, 16, 10, .38); color: #f4ecd8; font-size: 13px; letter-spacing: 1px;
    white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 1.2s; backdrop-filter: blur(4px); }
  #hint.on { opacity: 1; }
  #hint[hidden] { display: none; }
  /* 手机上的行走摇杆：手指按在屏幕左侧时出现在手指下面 */
  #stick { position: fixed; width: 104px; height: 104px; margin: -52px 0 0 -52px; border-radius: 50%; z-index: 4; pointer-events: none;
    border: 1px solid rgba(255, 255, 255, .35); background: rgba(255, 255, 255, .06); opacity: 0; transition: opacity .25s; }
  #stick.on { opacity: 1; }
  #stick i { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: rgba(255, 255, 255, .4); }
  #gear[hidden] { display: none; }
  #gear { position: fixed; right: 14px; top: 12px; width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.25); background: rgba(0,0,0,.25); color: #fff; font-size: 17px;
    cursor: pointer; backdrop-filter: blur(6px); }
  #panel { position: fixed; right: 14px; top: 54px; width: 270px; padding: 14px 16px; border-radius: 12px;
    background: rgba(12,16,28,.72); backdrop-filter: blur(10px); color: #e8ecf5; font-size: 13px;
    border: 1px solid rgba(255,255,255,.12); }
  #panel[hidden] { display: none; }
  #panel .row { display: flex; align-items: center; gap: 8px; margin: 9px 0; }
  #panel label { width: 34px; opacity: .75; flex: none; }
  #panel input[type=range] { flex: 1; }
  #panel select { flex: 1; background: rgba(255,255,255,.08); color: #fff; border: 1px solid rgba(255,255,255,.2); border-radius: 6px; padding: 4px; }
  #panel option { color: #000; }
  #panel button { width: 100%; margin-top: 6px; padding: 7px; border-radius: 6px; border: 0; background: rgba(255,255,255,.14); color: #fff; cursor: pointer; }
  #panel .note { opacity: .55; font-size: 11px; margin-top: 8px; line-height: 1.5; }
  #hourTxt { width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
  /* 许愿：签停稳、四周虚化之后出现的输入框 + 确认键 */
  #wishPanel { position: fixed; left: 50%; bottom: calc(10vh + env(safe-area-inset-bottom)); transform: translateX(-50%);
    display: flex; gap: 10px; align-items: center; z-index: 5; padding: 10px 12px; border-radius: 14px;
    background: rgba(20, 10, 8, .55); border: 1px solid rgba(243, 220, 156, .4); backdrop-filter: blur(6px);
    box-shadow: 0 8px 30px rgba(0,0,0,.45); animation: wishIn .5s ease-out; }
  #wishPanel[hidden] { display: none; }
  @keyframes wishIn { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }
  #wishInput { width: min(300px, 58vw); box-sizing: border-box; padding: 9px 12px; border-radius: 9px;
    border: 1px solid rgba(243, 220, 156, .55); background: rgba(0, 0, 0, .35); color: #f8e8bf; caret-color: #f6e2a8; outline: none;
    font: 20px/1.3 "STKaiti","KaiTi","Kaiti SC","楷体",serif; letter-spacing: 2px; }
  #wishInput:focus { border-color: #e7c574; box-shadow: 0 0 0 2px rgba(231, 197, 116, .25); }
  /* 确认键：一条游龙的简笔图案 */
  #wishOk { width: 54px; height: 42px; padding: 0; display: grid; place-items: center; border-radius: 10px; border: 0;
    background: #d9b25a; color: #4a0f0b; cursor: pointer; transition: transform .15s, background .2s; }
  #wishOk:not(:disabled):hover { background: #e7c574; transform: translateY(-1px); }
  #wishOk:disabled { opacity: .45; cursor: default; }
  /* 龙头印：线稿做遮罩，颜色跟随按钮文字色 */
  #wishOk .ico { width: 36px; height: 36px; background: currentColor;
    -webkit-mask: url(textures/wish_ok_dragon.png) center / contain no-repeat; mask: url(textures/wish_ok_dragon.png) center / contain no-repeat; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading"></div>
<div id="fade"></div>
<div id="hint" hidden></div>
<div id="stick"><i></i></div>
<button id="gear" title="调试面板" hidden>⚙</button>
<div id="wishPanel" hidden><input id="wishInput" maxlength="30" enterkeyhint="done" autocomplete="off" autocorrect="off" spellcheck="false"><button id="wishOk" disabled aria-label="确认" title="确认"><span class="ico" aria-hidden="true"></span></button></div>
<div id="panel" hidden>
  <div class="row"><label>时间</label><input type="range" id="hour" min="0" max="24" step="0.01"><span id="hourTxt"></span></div>
  <div class="row"><label>流速</label>
    <select id="speed">
      <option value="1">1×（真实）</option>
      <option value="60">60×（1 秒 = 1 分钟）</option>
      <option value="600">600×（1 秒 = 10 分钟）</option>
      <option value="3600">3600×（1 秒 = 1 小时）</option>
    </select></div>
  <div class="row"><label>天气</label>
    <select id="wx">
      <option value="live">实时天气</option>
      <option value="clear">晴</option>
      <option value="partly">多云</option>
      <option value="overcast">阴</option>
      <option value="fog">雾</option>
      <option value="drizzle">毛毛雨</option>
      <option value="rain">大雨</option>
      <option value="storm">雷雨</option>
      <option value="snow">雪</option>
    </select></div>
  <div class="row"><label>地点</label><span id="dbgPlace" style="flex:1"></span></div>
  <button id="reset">回到实时</button>
  <div class="note">调试用：拖动时间或加速流速，可以看光线连续变化。正式上线时可以隐藏此面板。</div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
