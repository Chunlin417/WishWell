<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="768" viewBox="0 0 2048 768">
  <defs>
    <filter id="plaster" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".018 .045" numOctaves="4" seed="27" result="grain"/>
      <feColorMatrix in="grain" type="matrix" values=".28 0 0 0 .34  0 .24 0 0 .31  0 0 .18 0 .24  0 0 0 .38 0" result="dust"/>
      <feBlend in="SourceGraphic" in2="dust" mode="multiply"/>
    </filter>
    <filter id="carve" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="3" specularConstant=".18" specularExponent="12" lighting-color="#fff3d7" result="light">
        <feDistantLight azimuth="315" elevation="42"/>
      </feSpecularLighting>
      <feComposite in="light" in2="SourceAlpha" operator="in" result="lit"/>
      <feBlend in="SourceGraphic" in2="lit" mode="soft-light"/>
    </filter>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8ad98"/>
      <stop offset=".52" stop-color="#aaa08d"/>
      <stop offset="1" stop-color="#918a7a"/>
    </linearGradient>
    <radialGradient id="moon" cx="46%" cy="40%" r="67%">
      <stop offset="0" stop-color="#d8c9a7"/>
      <stop offset=".72" stop-color="#c4b594"/>
      <stop offset="1" stop-color="#a89878"/>
    </radialGradient>
    <linearGradient id="fox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9bea7"/>
      <stop offset=".58" stop-color="#b8ae9c"/>
      <stop offset="1" stop-color="#9f988a"/>
    </linearGradient>
    <style>
      .cut{fill:none;stroke:#817c70;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;opacity:.62}
      .fine{fill:none;stroke:#d8c9ad;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:.72}
      .gold{fill:none;stroke:#9e8352;stroke-width:5;stroke-linecap:round;opacity:.48}
      .verd{fill:none;stroke:#5f756d;stroke-width:20;stroke-linecap:round;opacity:.34}
      .sien{fill:none;stroke:#94664d;stroke-width:14;stroke-linecap:round;opacity:.28}
      .cloud{fill:#bdb29d;stroke:#817c70;stroke-width:7;opacity:.68}
    </style>
  </defs>

  <rect width="2048" height="768" fill="url(#ground)" filter="url(#plaster)"/>
  <path d="M0 86C265 18 518 104 784 54S1324 62 1560 40s336 5 488-14" fill="none" stroke="#d2c5ab" stroke-width="15" opacity=".12"/>
  <path d="M75 346c206-58 399-29 559-3 176 29 286-26 430-18 172 10 275 46 453 11 175-34 344-3 475 30" fill="none" stroke="#796f62" stroke-width="12" opacity=".08"/>

  <!-- Quiet central moon, positioned for the guardian's head. -->
  <g filter="url(#carve)">
    <circle cx="1024" cy="395" r="206" fill="url(#moon)" stroke="#8f8066" stroke-width="10" opacity=".88"/>
    <circle cx="1024" cy="395" r="192" fill="none" stroke="#e0d1b1" stroke-width="4" opacity=".45"/>
    <path d="M900 333c55-29 151-42 232-3M871 425c75 32 220 36 310-3" class="fine" opacity=".16"/>
  </g>

  <!-- Left ascending fox: carved mass, worn mineral color only in recesses. -->
  <g filter="url(#carve)">
    <path d="M580 438c-54-31-65-91-40-145 24-52 69-75 104-123l8-58 28 38 42-28-12 53c39 9 70 27 92 52-39 8-73 3-102-14-22 47-23 96 4 137 26 39 20 78-12 115-38 44-77 51-112-27z" fill="url(#fox)" stroke="#777267" stroke-width="8"/>
    <path d="M649 154l18 42 34-12M699 212c31 9 59 12 84 4M625 271c31 19 65 22 97 7" class="fine"/>
    <path d="M672 351c30 28 58 53 88 71l58-8-45 31 28 45-50-27-41 33 20-51c-29-11-56-29-82-52" class="cut"/>
    <path d="M587 421C471 378 399 311 350 221 293 118 184 86 68 123c141 8 203 85 231 187 22 81 91 148 202 181" fill="none" stroke="#bdb3a1" stroke-width="72" stroke-linecap="round" opacity=".9"/>
    <path d="M582 447C443 465 357 424 290 344 223 264 131 247 42 293c118-11 180 50 223 133 37 70 113 109 228 101" fill="none" stroke="#b2aa9a" stroke-width="60" stroke-linecap="round" opacity=".82"/>
    <path d="M575 471C448 531 341 522 256 478 170 434 93 461 24 540c97-56 176-25 246 37 63 56 151 55 255-3" fill="none" stroke="#a9a394" stroke-width="52" stroke-linecap="round" opacity=".7"/>
    <path d="M568 417C458 378 399 313 355 230M564 449c-123 12-206-25-269-98M560 474c-115 53-210 47-298 7" class="verd"/>
    <path d="M545 408C448 351 396 271 365 197M540 465c-112 25-205 3-275-53" class="sien"/>
    <path d="M647 174c-17 11-29 27-35 46 19-12 37-15 56-9" class="gold"/>
  </g>

  <!-- Right fox varies in pose and tail rhythm to avoid mirrored ornament. -->
  <g filter="url(#carve)">
    <path d="M1466 435c58-22 83-76 68-133-14-54-55-86-83-139l3-58-35 33-36-36 2 55c-40 2-74 14-102 34 36 16 70 18 102 8 14 51 7 100-27 135-32 34-34 74-9 116 29 49 68 63 117-15z" fill="url(#fox)" stroke="#777267" stroke-width="8"/>
    <path d="M1447 142l-25 38-31-18M1387 198c-31 2-60 0-84-10M1437 264c-33 13-67 10-96 0" class="fine"/>
    <path d="M1380 343c-34 22-66 41-99 52l-56-20 38 40-36 38 54-17 34 41-10-54c31-5 61-18 90-36" class="cut"/>
    <path d="M1474 417c119-27 200-87 259-170 68-94 180-114 291-63-139-10-210 59-249 157-31 77-107 136-221 156" fill="none" stroke="#bdb3a1" stroke-width="72" stroke-linecap="round" opacity=".9"/>
    <path d="M1472 446c135 37 226 8 303-63 77-71 171-77 254-20-115-26-184 27-237 104-44 65-125 95-238 72" fill="none" stroke="#b2aa9a" stroke-width="60" stroke-linecap="round" opacity=".82"/>
    <path d="M1478 474c116 73 223 76 312 42 90-34 164 2 223 88-90-67-172-45-249 9-69 48-157 37-254-31" fill="none" stroke="#a9a394" stroke-width="52" stroke-linecap="round" opacity=".7"/>
    <path d="M1484 416c113-26 181-85 234-158M1489 448c121 27 208 0 280-67M1494 477c108 65 203 69 295 36" class="verd"/>
    <path d="M1506 407c103-45 164-119 204-191M1512 465c108 38 203 27 279-20" class="sien"/>
    <path d="M1427 166c15 14 24 32 26 51-16-15-34-22-53-19" class="gold"/>
  </g>

  <!-- Sparse cloud scrolls leave the moon and guardian silhouette clear. -->
  <g filter="url(#carve)">
    <path class="cloud" d="M140 176c28-48 78-53 105-17 17-42 73-37 84 4 56-19 91 40 48 69H143c-43-12-44-43-3-56z"/>
    <path class="fine" d="M164 194c43-29 87-19 99 12 19-31 61-30 82-8"/>
    <path class="cloud" d="M790 242c21-36 61-41 82-14 13-32 55-29 63 2 43-14 69 31 37 52H792c-32-9-34-31-2-40z" opacity=".52"/>
    <path class="cloud" d="M1250 238c23-39 66-43 88-15 14-34 59-30 68 3 46-16 75 33 39 56h-191c-35-10-37-33-4-44z" opacity=".5"/>
    <path class="cloud" d="M1690 138c31-51 83-56 112-18 18-45 77-40 89 4 59-21 96 42 51 72h-248c-46-13-47-46-4-58z"/>
    <path class="fine" d="M1717 158c45-31 91-20 104 13 20-33 65-32 87-9"/>
  </g>

  <!-- Low water register; multiple irregular lines create depth without visual noise. -->
  <g filter="url(#carve)">
    <path d="M-30 641c151-68 283-63 423-3s269 65 418 2 282-64 425-3 277 65 431 0 278-63 411-10" class="cut" stroke-width="22"/>
    <path d="M-24 684c139-56 271-47 404 10s273 49 408-9 272-50 417 9 279 48 420-12 281-45 447 10" class="verd" opacity=".58"/>
    <path d="M-20 724c158-50 291-33 419 18s260 32 393-18 271-36 420 17 291 35 442-19 280-29 414 12" class="sien" opacity=".5"/>
    <path d="M-10 606c132-51 259-46 385 4s260 54 397 4 268-53 407-4 276 57 423 2 290-51 456-4" class="fine" stroke-width="9"/>
    <path d="M-5 660c128-47 251-40 378 8s263 43 393-5 263-45 404 5 272 43 414-7 283-39 473 9" class="gold" opacity=".46"/>
  </g>

  <rect x="8" y="8" width="2032" height="752" fill="none" stroke="#756e62" stroke-width="16" opacity=".22"/>
</svg>
